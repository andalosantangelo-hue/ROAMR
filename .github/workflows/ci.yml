name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm run test
      - name: Coverage gate (core lib/components)
        run: npm i -D @vitest/coverage-v8 --no-save && npx vitest run --coverage
      - run: npm run build
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high || true

  # Security rules are the app's real security boundary: every attack found in the
  # beta bug run is pinned as a test here (test/rules*.test.js).
  security-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Firestore + Storage rules tests (emulators)
        run: npx firebase emulators:exec --project demo-roamr --only firestore,storage "npx vitest run --config vitest.rules.config.js"

  # Scripted users drive the real app against the emulators (never production) and
  # an audit checks stored data and counters. Fails on errors users would hit.
  synthetic-users:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium
      - run: node e2e/make-avatars.mjs
      - name: Build app against the emulators
        run: npm run build
        env:
          VITE_USE_EMULATORS: "1"
      - name: Run synthetic users
        run: |
          npx firebase emulators:exec --project demo-roamr --only auth,firestore,storage,functions \
            "npx vite preview --host 127.0.0.1 --port 5173 --strictPort & until curl -s http://127.0.0.1:5173 > /dev/null; do sleep 1; done; node e2e/synthetic-users.mjs ${E2E_USERS:-30} 4"
        env:
          E2E_USERS: ${{ github.event_name == 'push' && '100' || '30' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-user-results
          path: e2e/.results

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
